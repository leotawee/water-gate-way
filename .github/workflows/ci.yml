# CI: every push and pull request runs the same gate as a manual release.
# WHY pinned SHAs: a moved tag on a third-party action would run unreviewed code with this repo's token.
# WHY Node 20.20.2: the droplet runs it; test on what ships. Raise both together.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.20.2"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # One job per gate: each runs on its own runner (green/red box in the Actions UI), and the four
  # fan out in parallel the moment the build job lands — build still leads, tests never run on a
  # commit the compiler already rejected.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # WHY --ignore-scripts: no dependency needs an install script to build or test here,
      # so a compromised package's postinstall never runs in CI.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # WHY build first: `next build` fails fastest on compile-level breakage (a bad import, a type
      # error in the graph) — every gate below it waits for this one to pass.
      - run: npm run build

  typecheck:
    name: Typecheck
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint

  test:
    name: Test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Blocking: no high or critical advisory in any dependency (prod or dev). Reads the lockfile only.
      - run: npm audit --audit-level=high

  # CD, build half. The droplet is Tailscale-only (a GitHub-hosted runner cannot reach it) and has ~450 MB RAM,
  # so Actions builds the image and pushes it to GHCR; deploy/pull/pull-deploy.sh on the droplet pulls it.
  # Only after build, typecheck, lint, test and audit all passed, and only for main.
  release:
    name: Build and push image to GHCR
    needs: [build, typecheck, lint, test, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # WHY packages: write — push to ghcr.io and delete superseded image versions. Nothing else is elevated.
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        # WHY the short-lived job token, not a PAT: scope is this one run; no deploy key on the droplet is needed
        # because the repo (and so the package) is public.
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image (linux/amd64)
        # WHY docker build, not buildx/multi-arch: the droplet is x64; one platform keeps the build small and fast.
        run: docker build --platform linux/amd64 -t "$IMAGE:$TAG" -t "$IMAGE:main" .
      - name: Smoke-run the built image
        run: |
          docker run -d --name smoke -p 127.0.0.1:3100:3000 "$IMAGE:$TAG"
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/login)" = 200 ] && exit 0
            sleep 1
          done
          docker logs smoke; exit 1
      # WHY curl+tar, not trivy-action: its bundled installer downloads with hidden errors and died
      # in 100 ms on the first run — this way every network failure is visible and retryable.
      # Pinned release; no sudo needed (installs into $HOME).
      - name: Install Trivy
        env:
          # WHY not "latest": v0.65.0 has a git tag but no published release/assets — pin a version
          # whose release is verified to carry the Linux-64bit tarball.
          # WHY the checksum: the binary runs the blocking HIGH/CRITICAL gate in the job that can
          # push to GHCR - an unverified download is an unreviewed executable in a privileged job.
          TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
          TRIVY_VERSION: "0.76.2"
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" > /tmp/trivy.sha256
          sha256sum -c /tmp/trivy.sha256
          tar -xzf /tmp/trivy.tgz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # WHY before push: a HIGH/CRITICAL CVE in the image must fail here, not land in the registry
      # the droplet pulls. ignore-unfixed: never block on an OS bug with no vendor patch yet.
      # npm audit (above) covers the JS dependencies; this covers the container they ship in.
      - name: Scan image with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --vuln-type os,library \
            --exit-code 1 \
            "$IMAGE:$TAG"
      - name: Push image
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:main"
      # WHY prune here and not by a retention policy: GHCR keeps every pushed tag forever otherwise, and the
      # package API lets us keep exactly the newest 10 sha-* versions plus drop untagged leftovers.
      - name: Prune old GHCR versions (keep 10 newest sha-*)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="${GITHUB_REPOSITORY#*/}"
          # WHY /users/<owner>: GITHUB_TOKEN has no authenticated user, so /user/... returns 403.
          base="/users/$GITHUB_REPOSITORY_OWNER/packages/container/$pkg/versions"
          gh api --paginate "$base?per_page=100" > versions.json
          jq -s 'add | sort_by(.created_at) | reverse' versions.json > sorted.json
          # Keep: versions that still carry the rolling `main` tag. Delete: untagged (untagged-by-prune) and
          # every sha-* version beyond the 10 newest.
          jq -r '.[] | select((.metadata.container.tags | index("main") | not) and
                 ((.metadata.container.tags | any(startswith("sha-"))) | not)) | "\(.id) untagged"' sorted.json
          jq -r '[.[] | select(.metadata.container.tags | any(startswith("sha-")))] | .[10:][] | "\(.id) old-sha"' sorted.json
          jq -r '.[] | select((.metadata.container.tags | index("main") | not) and
                 ((.metadata.container.tags | any(startswith("sha-"))) | not)) | .id' sorted.json |
            while read -r id; do gh api -X DELETE "$base/$id" || echo "prune: could not delete version $id"; done
          jq -r '[.[] | select(.metadata.container.tags | any(startswith("sha-")))] | .[10:][] | .id' sorted.json |
            while read -r id; do gh api -X DELETE "$base/$id" || echo "prune: could not delete version $id"; done

  deploy:
    name: Deploy to droplet over Tailscale
    needs: [release]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # WHY one at a time and never cancelled: a half-finished deploy must complete before the next starts.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      # WHY skip, not fail: until the owner adds the secrets, the timer on the droplet still deploys.
      - name: Check deploy secrets
        id: cfg
        run: |
          ok=true
          for v in TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::notice::secret for $v is not set; skipping push deploy (the droplet timer still pulls)"; ok=false; }
          done
          echo "ready=$ok" >> "$GITHUB_OUTPUT"
      - name: Join tailnet
        if: steps.cfg.outputs.ready == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cicd
      - name: Deploy this commit
        if: steps.cfg.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          # WHY a pinned known_hosts secret, not ssh-keyscan: scanning would trust whatever answers on first contact.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The only argument is the commit sha; the droplet key is forced to run pull-deploy.sh and the
          # script validates the sha (^[0-9a-f]{40}$) before using it.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_SHA"
