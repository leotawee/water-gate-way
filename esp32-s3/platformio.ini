; PlatformIO Project Configuration File for ESP32-S3 HMI Water Gate Controller
;
;   Build targets: `pio run`, `pio run --target upload`, etc.
;   Upload targets: `pio run --target upload` or press F1 in VSCode

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor options
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build options
; (using TFT_eSPI User_Setup.h in library directory)

; Library dependencies
lib_deps =
    lvgl @ ~8.3.11
    TFT_eSPI

; Upload settings
upload_speed = 921600
upload_port = COM4  ; Change this to match your ESP32-S3 port

; Debug settings (optional)
debug_tool = esp-prog
debug_init_break = tbreak setup
