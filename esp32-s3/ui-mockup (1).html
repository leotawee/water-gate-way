<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HMI Mockup - Water Gate 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .device-frame {
            width: 480px;
            height: 320px;
            background: #0f0f23;
            border-radius: 16px;
            border: 6px solid #2a2a4a;
            box-shadow: 0 0 50px rgba(0, 188, 212, 0.3);
            overflow: hidden;
            position: relative;
        }

        .screen {
            width: 100%;
            height: 100%;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
        }

        /* ── Header (compact) ── */
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #2a2a4a;
            gap: 6px;
        }

        .header h1 {
            font-size: 14px;
            color: #00bcd4;
            font-weight: 600;
            white-space: nowrap;
        }

        .header .mode-badge {
            margin-left: auto;
            background: #ff9800;
            color: #0f0f23;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 10px;
            letter-spacing: 1px;
        }

        .header .icon-btn {
            width: 28px;
            height: 28px;
            background: #2a2a4a;
            border: none;
            border-radius: 6px;
            color: #00bcd4;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ── Main Content (3 columns) ── */
        .main-display {
            flex: 1;
            display: flex;
            gap: 10px;
            min-height: 0;
        }

        /* Column 1: Bar Graph */
        .bar-column {
            flex: 1;
            background: #1a1a3e;
            border-radius: 10px;
            padding: 8px;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bar-wrapper {
            width: 60px;
            height: 100%;
            background: #0a0a1a;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 62%;
            background: linear-gradient(to top, #0066cc, #00bcd4);
            border-radius: 0 0 6px 6px;
            transition: height 0.5s ease;
        }

        .bar-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 14px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
        }

        /* Threshold Lines */
        .threshold {
            position: absolute;
            left: 4px;
            right: 4px;
            height: 2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 9px;
            color: #fff;
            font-weight: 500;
        }

        .threshold::before {
            content: '';
            flex: 1;
            height: 1px;
            background: #ff9800;
            margin-right: 4px;
        }

        .threshold-lv3 { bottom: 72%; }
        .threshold-lv2 { bottom: 50%; }
        .threshold-lv1 { bottom: 28%; }

        /* Column 2: Pump Status */
        .pump-column {
            width: 90px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pump-box {
            flex: 1;
            background: #1a1a3e;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pump-box .label {
            font-size: 10px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pump-box .status {
            font-size: 13px;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 4px;
            display: inline-block;
        }

        .status-run {
            background: #1b5e20;
            color: #4caf50;
        }

        .status-stop {
            background: #424242;
            color: #9e9e9e;
        }

        /* Column 3: Info Panel */
        .info-column {
            width: 130px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-box {
            flex: 1;
            background: #1a1a3e;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .info-label {
            font-size: 9px;
            color: #888;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 22px;
            color: #00bcd4;
            font-weight: bold;
            line-height: 1.1;
        }

        .info-unit {
            font-size: 10px;
            color: #666;
        }

        /* ── Bottom Navigation ── */
        .bottom-nav {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .nav-btn {
            flex: 1;
            background: #2a2a4a;
            border: 1px solid #00bcd4;
            border-radius: 8px;
            padding: 8px;
            color: #00bcd4;
            font-size: 11px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-btn.active {
            background: #00bcd4;
            color: #0f0f23;
        }

        /* ══════════════════════════════════════════
           Settings Screen (Landscape)
           ══════════════════════════════════════════ */
        .settings-screen {
            display: none;
        }

        .settings-screen.active {
            display: flex;
            flex-direction: column;
        }

        /* ── Settings Menu ── */
        .settings-menu-grid {
            flex: 1;
            display: flex;
            gap: 12px;
            padding: 6px 0;
        }

        .menu-btn {
            flex: 1;
            background: linear-gradient(135deg, #1a1a3e 0%, #252550 100%);
            border: 2px solid #2a2a4a;
            border-radius: 14px;
            padding: 12px;
            color: #fff;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: #00bcd4;
            border-radius: 14px 14px 0 0;
        }

        .menu-btn:last-child::before {
            background: #ff9800;
        }

        .menu-btn:hover, .menu-btn:active {
            border-color: #00bcd4;
            transform: scale(0.98);
        }

        .menu-btn:last-child:hover, .menu-btn:last-child:active {
            border-color: #ff9800;
        }

        .menu-icon {
            font-size: 32px;
            margin-bottom: 4px;
        }

        .menu-title {
            font-weight: 700;
            font-size: 13px;
        }

        .menu-desc {
            font-size: 10px;
            color: #888;
            margin-top: 3px;
        }

        /* ── Sub-pages ── */
        .sub-page {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .sub-page.active {
            display: flex;
        }

        /* ── Setup Row (label + stepper) ── */
        .setup-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        .setup-row {
            flex: 1;
            background: #1a1a3e;
            border-radius: 10px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 0;
        }

        .setup-row .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .setup-row .row-label {
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
            min-width: 110px;
        }

        /* Stepper: [−] [value] [+] */
        .stepper {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }

        .stepper-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid #2a2a4a;
            background: #2a2a4a;
            color: #00bcd4;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            transition: background 0.15s;
            flex-shrink: 0;
        }

        .stepper-btn:active {
            background: #00bcd4;
            color: #0f0f23;
        }

        .stepper-value {
            width: 64px;
            text-align: center;
            background: #0a0a1a;
            border: 1px solid #2a2a4a;
            border-radius: 6px;
            padding: 6px 4px;
            color: #00bcd4;
            font-size: 17px;
            font-weight: 600;
            font-family: 'Segoe UI', monospace;
        }

        .stepper-value[readonly] {
            color: #666;
        }

        .stepper-unit {
            font-size: 11px;
            color: #666;
            width: 18px;
        }

        /* ── Threshold Visual (mini bar on left) ── */
        .threshold-layout {
            flex: 1;
            display: flex;
            gap: 12px;
            min-height: 0;
        }

        .threshold-visual {
            width: 70px;
            background: #1a1a3e;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .mini-bar {
            width: 40px;
            height: 100%;
            background: #0a0a1a;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .mini-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 62%;
            background: linear-gradient(to top, #0066cc, #00bcd4);
            border-radius: 0 0 6px 6px;
        }

        .mini-threshold {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
        }

        .mini-threshold::before {
            content: '';
            display: block;
            width: 100%;
            height: 2px;
        }

        .mini-lv1 { bottom: 40%; }
        .mini-lv1::before { background: #4caf50; }
        .mini-lv2 { bottom: 60%; }
        .mini-lv2::before { background: #ff9800; }
        .mini-lv3 { bottom: 80%; }
        .mini-lv3::before { background: #f44336; }

        .threshold-form {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Color dots per level */
        .dot-green { background: #4caf50; }
        .dot-orange { background: #ff9800; }
        .dot-red { background: #f44336; }
        .dot-cyan { background: #00bcd4; }

        /* ── Button Group ── */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.15s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary {
            background: #00bcd4;
            color: #0f0f23;
        }

        .btn-secondary {
            background: #2a2a4a;
            color: #9e9e9e;
        }
    </style>
</head>
<body>
    <div class="device-frame">
        <!-- ═══════ Main Screen ═══════ -->
        <div class="screen main-screen" id="mainScreen">
            <!-- Header with integrated Mode -->
            <div class="header">
                <h1>⚡ WATER GATE 1</h1>
                <span class="mode-badge">AUTO</span>
                <button class="icon-btn" onclick="showSettings()">⚙️</button>
            </div>

            <!-- Main Content: 3 columns -->
            <div class="main-display">
                <!-- Col 1: Water Level Bar -->
                <div class="bar-column">
                    <div class="bar-wrapper">
                        <div class="bar-fill" id="waterBar"></div>
                        <div class="threshold threshold-lv3">
                            <span>Lv3</span>
                            <span>1.80m</span>
                        </div>
                        <div class="threshold threshold-lv2">
                            <span>Lv2</span>
                            <span>1.50m</span>
                        </div>
                        <div class="threshold threshold-lv1">
                            <span>Lv1</span>
                            <span>0.80m</span>
                        </div>
                    </div>
                </div>

                <!-- Col 2: Pump Status -->
                <div class="pump-column">
                    <div class="pump-box">
                        <div class="label">PUMP 1</div>
                        <div class="status status-run">RUN</div>
                    </div>
                    <div class="pump-box">
                        <div class="label">PUMP 2</div>
                        <div class="status status-stop">STOP</div>
                    </div>
                </div>

                <!-- Col 3: Info Panel -->
                <div class="info-column">
                    <div class="info-box">
                        <div class="info-label">Current</div>
                        <div class="info-value" id="currentLevel">1.25</div>
                        <div class="info-unit">meters</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Sensor</div>
                        <div class="info-value" style="font-size: 18px;">2.50</div>
                        <div class="info-unit">m height</div>
                    </div>
                </div>
            </div>

            <!-- Bottom Nav -->
            <div class="bottom-nav">
                <button class="nav-btn active" onclick="showMain()">📊 Main</button>
                <button class="nav-btn" onclick="showSettings()">⚙️ Settings</button>
            </div>
        </div>

        <!-- ═══════ Settings Screen ═══════ -->
        <div class="screen settings-screen" id="settingsScreen">

            <!-- ── Settings Menu ── -->
            <div class="sub-page active" id="settingsMenu">
                <div class="header">
                    <h1>⚙️ SETTINGS</h1>
                    <button class="icon-btn" onclick="showMain()">✕</button>
                </div>

                <div class="settings-menu-grid">
                    <button class="menu-btn" onclick="showSensorSetup()">
                        <div class="menu-icon">📡</div>
                        <div class="menu-title">Sensor Setup</div>
                        <div class="menu-desc">ตั้งค่าระยะเซนเซอร์</div>
                    </button>

                    <button class="menu-btn" onclick="showThresholdSetup()">
                        <div class="menu-icon">📊</div>
                        <div class="menu-title">Threshold Setup</div>
                        <div class="menu-desc">ตั้งค่าระดับน้ำ 3 ระดับ</div>
                    </button>
                </div>

                <div class="bottom-nav">
                    <button class="nav-btn" onclick="showMain()">📊 Main</button>
                    <button class="nav-btn active">⚙️ Settings</button>
                </div>
            </div>

            <!-- ── Sensor Setup ── -->
            <div class="sub-page" id="sensorSetup">
                <div class="header">
                    <h1>📡 SENSOR SETUP</h1>
                    <button class="icon-btn" onclick="showSettingsMenu()">←</button>
                </div>

                <div class="setup-list">
                    <div class="setup-row">
                        <span class="dot dot-cyan"></span>
                        <span class="row-label">Water Level</span>
                        <div class="stepper">
                            <button class="stepper-btn" onclick="stepValue(this,-0.01)">−</button>
                            <input class="stepper-value" type="number" value="1.25" step="0.01" id="sensorWater">
                            <button class="stepper-btn" onclick="stepValue(this,0.01)">+</button>
                            <span class="stepper-unit">m</span>
                        </div>
                    </div>
                    <div class="setup-row">
                        <span class="dot dot-cyan"></span>
                        <span class="row-label">Distance</span>
                        <div class="stepper">
                            <button class="stepper-btn" onclick="stepValue(this,-0.01)">−</button>
                            <input class="stepper-value" type="number" value="1.25" step="0.01" id="sensorDist">
                            <button class="stepper-btn" onclick="stepValue(this,0.01)">+</button>
                            <span class="stepper-unit">m</span>
                        </div>
                    </div>
                    <div class="setup-row">
                        <span class="dot dot-cyan"></span>
                        <span class="row-label">Sensor Height</span>
                        <div class="stepper">
                            <button class="stepper-btn" style="visibility:hidden;">−</button>
                            <input class="stepper-value" type="number" value="2.50" step="0.01" readonly id="sensorHeight">
                            <button class="stepper-btn" style="visibility:hidden;">+</button>
                            <span class="stepper-unit">m</span>
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="showSettingsMenu()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveSensorSetup()">💾 Save</button>
                </div>
            </div>

            <!-- ── Threshold Setup ── -->
            <div class="sub-page" id="thresholdSetup">
                <div class="header">
                    <h1>📊 THRESHOLD</h1>
                    <button class="icon-btn" onclick="showSettingsMenu()">←</button>
                </div>

                <div class="threshold-layout">
                    <!-- Mini visual bar -->
                    <div class="threshold-visual">
                        <div class="mini-bar">
                            <div class="mini-fill" id="miniBarFill"></div>
                            <div class="mini-threshold mini-lv1"></div>
                            <div class="mini-threshold mini-lv2"></div>
                            <div class="mini-threshold mini-lv3"></div>
                        </div>
                    </div>
                    <!-- Form -->
                    <div class="threshold-form">
                        <div class="setup-row">
                            <span class="dot dot-green"></span>
                            <span class="row-label">Lv1 Stop</span>
                            <div class="stepper">
                                <button class="stepper-btn" onclick="stepValue(this,-0.01)">−</button>
                                <input class="stepper-value" type="number" value="0.80" step="0.01">
                                <button class="stepper-btn" onclick="stepValue(this,0.01)">+</button>
                                <span class="stepper-unit">m</span>
                            </div>
                        </div>
                        <div class="setup-row">
                            <span class="dot dot-orange"></span>
                            <span class="row-label">Lv2 Pump1</span>
                            <div class="stepper">
                                <button class="stepper-btn" onclick="stepValue(this,-0.01)">−</button>
                                <input class="stepper-value" type="number" value="1.50" step="0.01">
                                <button class="stepper-btn" onclick="stepValue(this,0.01)">+</button>
                                <span class="stepper-unit">m</span>
                            </div>
                        </div>
                        <div class="setup-row">
                            <span class="dot dot-red"></span>
                            <span class="row-label">Lv3 Pump1+2</span>
                            <div class="stepper">
                                <button class="stepper-btn" onclick="stepValue(this,-0.01)">−</button>
                                <input class="stepper-value" type="number" value="1.80" step="0.01">
                                <button class="stepper-btn" onclick="stepValue(this,0.01)">+</button>
                                <span class="stepper-unit">m</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="showSettingsMenu()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveThresholdSetup()">💾 Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showMain() {
            document.getElementById('mainScreen').style.display = 'flex';
            document.getElementById('settingsScreen').classList.remove('active');
            // Reset all sub-pages
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById('settingsMenu').classList.add('active');
        }

        function showSettings() {
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('settingsScreen').classList.add('active');
            showSettingsMenu();
        }

        function showSettingsMenu() {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById('settingsMenu').classList.add('active');
        }

        function showSensorSetup() {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById('sensorSetup').classList.add('active');
        }

        function showThresholdSetup() {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById('thresholdSetup').classList.add('active');
        }

        // Stepper +/− handler
        function stepValue(btn, delta) {
            const input = btn.parentElement.querySelector('.stepper-value');
            let val = parseFloat(input.value) || 0;
            val = Math.round((val + delta) * 100) / 100;
            val = Math.max(0, val);
            input.value = val.toFixed(2);
            // Auto-calc sensor height
            if (input.id === 'sensorWater' || input.id === 'sensorDist') {
                const w = parseFloat(document.getElementById('sensorWater').value) || 0;
                const d = parseFloat(document.getElementById('sensorDist').value) || 0;
                document.getElementById('sensorHeight').value = (w + d).toFixed(2);
            }
        }

        function saveSensorSetup() {
            alert('Sensor Setup Saved!\nSending to STM32 via UART...');
            showSettingsMenu();
        }

        function saveThresholdSetup() {
            alert('Threshold Setup Saved!\nSending to STM32 via UART...');
            showSettingsMenu();
        }

        // Simulate water level animation
        let level = 1.25;
        setInterval(() => {
            level += (Math.random() - 0.5) * 0.1;
            level = Math.max(0, Math.min(2.0, level));
            document.getElementById('currentLevel').textContent = level.toFixed(2);
            document.getElementById('waterBar').style.height = (level / 2.0 * 100) + '%';
        }, 2000);
    </script>
</body>
</html>
